# OpenFDTD-X (GUI) CI — Linux/Windows/macOS で Qt6 ビルド + 自己テスト。
# 処理ロジック (ofd/orcwa/obpm) はビルドに不要 (実行時に QProcess で起動する
# 疎結合) のため、ビルド自体はカーネル無しで完結する。
# ただし OpenFDTD (ofd) は基幹カーネルのため、Linux ジョブだけは実ビルドして
# selftest の統合スモーク (OFDX_OFD_BIN — dipole.ofd 実行 → normal end) と、
# MPI 版 (ofd_mpi) を使う ctest の kernel.runner_mpi (Runner が mpiexec を
# 起動して完走し、結果が CPU 実行と一致すること) を回す。
# 光 (orcwa/obpm)・水中 (bellhopcxx) はオプションカーネルで CI 対象外。
# 3 OS とも USE_HDF5=ON でビルドする (HDF5 の読み書きは結果表示の必須経路で、
# OFF のジョブでは io/H5Reader・io/H5Writer のテストが丸ごと skip されるため)。
name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev libhdf5-dev

      # Linux ジョブは USE_HDF5=ON でビルドし、HDF5 読み取り (H5Reader —
      # 解析結果の 2D 断面反映と H5 アニメタブ) の gated コードも検証する
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_HDF5=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # 基幹カーネル OpenFDTD を実ビルドし、selftest の統合スモークに渡す
      # (GUI → subprocess 連携の回帰検出。光/水中カーネルはオプションのため対象外)
      # CPU 版に加えて MPI 版もビルドする。両方 /tmp/OpenFDTD/bin に入るので、
      # ctest の kernel.runner_mpi (GUI の Runner が mpiexec を起動して
      # 完走し、結果が CPU 実行と一致することを見る統合テスト) が走るようになる。
      # ここを入れないと、Runner の MPI 経路は CI で一度も実行されない。
      - name: Build OpenFDTD kernel (integration smoke)
        run: |
          sudo apt-get install -y libhdf5-dev libopenmpi-dev openmpi-bin
          git clone --depth 1 https://github.com/Sirokujira/OpenFDTD.git /tmp/OpenFDTD
          cmake -S /tmp/OpenFDTD -B /tmp/OpenFDTD/build \
            -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF
          cmake --build /tmp/OpenFDTD/build -j"$(nproc)"
          test -x /tmp/OpenFDTD/bin/ofd
          cmake -S /tmp/OpenFDTD -B /tmp/OpenFDTD/build-mpi \
            -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=ON
          cmake --build /tmp/OpenFDTD/build-mpi -j"$(nproc)"
          test -x /tmp/OpenFDTD/bin/ofd_mpi

      - name: Self test (.ofd round-trip + voxelizer + glass + room acoustics)
        run: OFDX_OFD_BIN=/tmp/OpenFDTD/bin/ofd ./build/ofdx_selftest

      # 音響コア (C++14) は上の Build ステップに含まれる。ここでは CTest に
      # 登録された acoustics.* テストを実行する。合成 RIR による残響指標の
      # 検証は acoustics.reverberation (test_reverberation) が担う。
      # acoustics.c_api (tests/acoustics/test_c_api.c) は CMake により
      # C コンパイラで -std=c99 としてビルドされるため、この ctest 実行が
      # 「C API が純 C としてコンパイル・リンクできる」ことの検証を兼ねる。
      # 実外部ソルバーは不要: 人工 RIR はその場で生成し、フェーズ5 の
      # acoustics.runner はビルド済みモックソルバー
      # (ofdx_mock_acoustic_solver — 出力契約の参照実装) を起動して
      # AcousticRunner → 契約検証 → RirAnalyzer の統合経路を検証する。
      # OFDX_OFD_BIN があると kernel.runner_mpi も走る (無ければ skip)。
      # OpenMPI を root で走らせるための --allow-run-as-root は
      # OMPI_ALLOW_RUN_AS_ROOT で渡す (GitHub のランナーは root 実行)。
      - name: Acoustics tests (ctest)
        run: ctest --test-dir build --output-on-failure
        env:
          OFDX_OFD_BIN: /tmp/OpenFDTD/bin/ofd
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

      - name: GUI smoke (offscreen screenshot)
        run: |
          export QT_QPA_PLATFORM=offscreen XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p /tmp/xdg
          timeout 60 ./build/openfdtd_x tests/data/dipole.ofd \
            --domain optical --screenshot /tmp/gui-optical.png
          timeout 60 ./build/openfdtd_x tests/data/dipole.ofd \
            --domain acoustic --screenshot /tmp/gui-acoustic.png
          test -s /tmp/gui-optical.png && test -s /tmp/gui-acoustic.png
          # 読み込めない .ofd を渡しても止まらないこと。自動実行でモーダルを
          # 出すと押す人が居ないので永久に待ち、CI は診断も無しにタイムアウト
          # する (実際にこれで止まった)。timeout に殺されず終了することが判定
          printf 'not an ofd file\n' > /tmp/broken.ofd
          timeout 60 ./build/openfdtd_x /tmp/broken.ofd \
            --screenshot /tmp/gui-broken.png
          test -s /tmp/gui-broken.png
          # OpenUWA (水中音響 分離アプリ) も同じ手順で起動確認する
          timeout 60 ./build/openuwa tests/data/dipole.ofd \
            --screenshot /tmp/gui-openuwa.png
          test -s /tmp/gui-openuwa.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: /tmp/gui-*.png

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Qt 6.5.x は qvarlengtharray.h が stdext::checked_array_iterator を
      # 参照しており、VS2022 17.13 (MSVC 14.43) でこれが削除されたため
      # windows-latest の現行ツールセットではコンパイル不能
      # ("stdext is not a class or namespace name")。stdext 不使用の
      # Qt 6.8 LTS (msvc2022) へ更新して根本解決する。
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      # Windows も USE_HDF5=ON でビルドする。Linux / macOS は既に ON なのに
      # ここだけ OFF で、HDF5 読み書き (io/H5Reader / io/H5Writer) のテストが
      # **Windows では 1 件も走っていなかった** (selftest が "built without
      # USE_HDF5" と出して skip する ~190 checks)。依存はカーネル側の
      # Windows CI と同じ vcpkg の静的リンク (x64-windows-static-md) を使う。
      # szip は libaec の取得が不安定なので使わない (core+zlib のみ)。
      - name: Install HDF5 (vcpkg)
        run: vcpkg install "hdf5[core,zlib]:x64-windows-static-md" --recurse

      - name: Configure
        run: >
          cmake -B build -DUSE_HDF5=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Self test
        run: build/Release/ofdx_selftest.exe
        shell: bash

      # Linux と同様: CTest 登録済みの acoustics.* を実行する
      # (acoustics.c_api は C99 としてコンパイルされた純 C テスト)。
      # TMPDIR は test_wav の一時 wav 出力先 (既定 /tmp は Windows に無い)。
      - name: Acoustics tests (ctest)
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          TMPDIR: ${{ runner.temp }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Homebrew の qt は 6.x 最新 (現行 6.11)。formula 名は "qt" で、
      # CMake から見つけるには prefix を CMAKE_PREFIX_PATH に渡す必要がある
      # (keg-only ではないが、Qt6Config.cmake は opt/qt/lib/cmake 配下)。
      - name: Install Qt6
        run: brew install qt hdf5

      # macOS も USE_HDF5=ON でビルドする。結果表示 (2D 断面 / 3D 断面 /
      # H5 アニメ) は HDF5 必須で README も -DUSE_HDF5=ON を案内しているのに、
      # 以前は Linux でしかこの経路をコンパイルしていなかった
      # (Apple clang / Homebrew HDF5 固有の問題を CI で拾えない状態だった)。
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_HDF5=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DHDF5_ROOT="$(brew --prefix hdf5)"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Self test
        run: ./build/ofdx_selftest

      - name: Acoustics tests (ctest)
        run: ctest --test-dir build --output-on-failure

      # macOS は MACOSX_BUNDLE ON のため実体は .app バンドル内にある
      # (./build/openfdtd_x では見つからない — Linux とパスが異なる)。
      - name: GUI smoke (offscreen screenshot)
        run: |
          export QT_QPA_PLATFORM=offscreen
          BIN=build/openfdtd_x.app/Contents/MacOS/openfdtd_x
          test -x "$BIN"
          for d in em optical acoustic underwater; do
            "$BIN" tests/data/dipole.ofd \
              --domain "$d" --screenshot "$RUNNER_TEMP/gui-$d.png"
            test -s "$RUNNER_TEMP/gui-$d.png"
          done
          # OpenUWA (水中音響 分離アプリ)
          UWA=build/openuwa.app/Contents/MacOS/openuwa
          test -x "$UWA"
          "$UWA" tests/data/dipole.ofd --screenshot "$RUNNER_TEMP/gui-openuwa.png"
          test -s "$RUNNER_TEMP/gui-openuwa.png"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots-macos
          path: ${{ runner.temp }}/gui-*.png
